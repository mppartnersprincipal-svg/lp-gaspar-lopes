<meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}*{box-sizing:border-box}</style><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script><script src="../../ds-runtime.js"></script><div id="root"></div>
<script type="text/babel">
function __ns(){if(window.GasparLopes)return window.GasparLopes;var ks=Object.keys(window);for(var i=0;i<ks.length;i++){try{var v=window[ks[i]];if(v&&typeof v==="object"&&(v.Button||v.Input)&&v.Card!==undefined||v&&v.Button&&v.HighlightCircle){return v}}catch(e){}}for(var i=0;i<ks.length;i++){try{var v=window[ks[i]];if(v&&typeof v==="object"&&v.Button){return v}}catch(e){}}return {}}
const NS=__ns();const {Button,IconButton,Badge,Divider,Input,Textarea,Card,HighlightCircle,SectionTitle}=NS;
const HL=["Clientes","GASPAR","Fica a dica!","2026","Palestras GL","Depoimentos","Horários"];
const wrap={maxWidth:"var(--container)",margin:"0 auto",padding:"0 32px"};

function Hero(){return <header style={{padding:"120px 0 96px",background:"radial-gradient(ellipse 70% 60% at 50% 0%, rgba(10,36,83,.35), transparent)"}}><div style={{...wrap,display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:28}}><Badge variant="outline">Alfaiataria sob medida</Badge><h1 style={{margin:0,fontFamily:"var(--font-display)",fontWeight:400,fontSize:"var(--fs-display)",lineHeight:"var(--lh-tight)",letterSpacing:"var(--ls-heading)",textTransform:"uppercase",color:"var(--text-heading)",maxWidth:820}}>O clássico, <em style={{fontFamily:"var(--font-accent)",fontStyle:"italic",textTransform:"none",letterSpacing:0,fontWeight:500}}>feito para você</em></h1><p style={{margin:0,maxWidth:560,fontSize:"var(--fs-body)",lineHeight:"var(--lh-body)",color:"var(--text-body)"}}>Ternos, camisas e ajustes sob medida em atendimento individual. Cada peça começa em uma conversa e termina no caimento exato.</p><div style={{display:"flex",gap:16}}><Button variant="primary" size="lg">Agendar horário</Button><Button variant="outline" size="lg">Conhecer o atelier</Button></div></div></header>;}
function Highlights(){return <section style={{padding:"32px 0 96px"}}><div style={{...wrap,display:"flex",gap:20,justifyContent:"center",flexWrap:"wrap"}}>{HL.map((l,i)=><HighlightCircle key={l} label={l} src={"../../assets/highlights/highlight-"+i+".png"} size={92}/>)}</div></section>;}
const SV=[["Sob medida","Terno completo desenhado do zero: escolha de tecido, duas provas e acabamento à mão.","M5 12h14M13 6l6 6-6 6"],["Ajustes","Caimento perfeito para peças que você já tem — barra, cintura, ombro e mangas.","M5 12h14M13 6l6 6-6 6"],["Consultoria","Guarda-roupa pensado para sua rotina, do casual ao black tie.","M5 12h14M13 6l6 6-6 6"]];
function Servicos(){return <section id="serviços" style={{padding:"96px 0",borderTop:"1px solid var(--border-subtle)"}}><div style={wrap}><SectionTitle overline="Serviços" title="O que fazemos" style={{marginBottom:56}}/><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:24}}>{SV.map(([t,d])=><Card key={t} padding={36}><div style={{display:"flex",flexDirection:"column",gap:16}}><h3 style={{margin:0,fontFamily:"var(--font-display)",fontWeight:400,fontSize:"var(--fs-h3)",letterSpacing:"var(--ls-heading)",textTransform:"uppercase",color:"var(--text-heading)"}}>{t}</h3><Divider width={48}/><p style={{margin:0,fontSize:15,lineHeight:"var(--lh-body)",color:"var(--text-body)"}}>{d}</p></div></Card>)}</div></div></section>;}
const DP=[["“O primeiro terno sob medida da minha vida. O caimento é outra coisa — nunca mais prateleira.”","Marcos A."],["“Atendimento impecável do início ao fim. As provas fizeram toda a diferença no resultado.”","Rafael S."]];
function Depoimentos(){return <section id="depoimentos" style={{padding:"96px 0",borderTop:"1px solid var(--border-subtle)"}}><div style={wrap}><SectionTitle overline="Depoimentos" title="Quem já vestiu" style={{marginBottom:56}}/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>{DP.map(([q,a])=><Card raised={true} key={a} padding={40}><div style={{display:"flex",flexDirection:"column",gap:20}}><p style={{margin:0,fontFamily:"var(--font-accent)",fontStyle:"italic",fontSize:22,lineHeight:1.5,color:"var(--fg-1)"}}>{q}</p><span style={{fontFamily:"var(--font-display)",fontSize:13,letterSpacing:"var(--ls-caps)",textTransform:"uppercase",color:"var(--text-muted)"}}>{a}</span></div></Card>)}</div></div></section>;}
function Contato(){return <section id="contato" style={{padding:"96px 0",borderTop:"1px solid var(--border-subtle)"}}><div style={{...wrap,display:"grid",gridTemplateColumns:"1fr 1fr",gap:64}}><div style={{display:"flex",flexDirection:"column",gap:24}}><SectionTitle overline="Contato" title="Agende sua" accent="prova" align="left"/><p style={{margin:0,fontSize:"var(--fs-body)",lineHeight:"var(--lh-body)",color:"var(--text-body)"}}>Atendimento com hora marcada, de segunda a sábado.</p><div style={{display:"flex",flexDirection:"column",gap:8,fontSize:15,color:"var(--text-muted)"}}><span>Seg – Sex · 9h às 19h</span><span>Sáb · 9h às 13h</span></div></div><div style={{display:"flex",flexDirection:"column",gap:24}}><Input label="Nome" placeholder="Seu nome completo"/><Input label="WhatsApp" placeholder="(47) 9 9999-9999"/><Textarea label="Mensagem" rows={4} placeholder="Conte o que você precisa"/><Button variant="primary" style={{alignSelf:"flex-start"}}>Enviar mensagem</Button></div></div></section>;}
function Footer(){return <footer style={{borderTop:"1px solid var(--border-subtle)",padding:"48px 0"}}><div style={{...wrap,display:"flex",alignItems:"center",justifyContent:"space-between"}}><img src="../../assets/logo-branco.png" alt="Gaspar Lopes" style={{height:64}}/><span style={{fontSize:13,color:"var(--text-muted)"}}>© 2026 Gaspar Lopes Alfaiataria</span></div></footer>;}
function App(){return <div><Nav/><Hero/><Highlights/><Servicos/><Depoimentos/><Contato/><Footer/></div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
